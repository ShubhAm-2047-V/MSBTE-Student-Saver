{% extends "base.html" %}

{% block title %}500 Server Error | MSBTE Student Saver{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 p-5 bg-white">
                <div class="text-danger mb-3">
                    <i class="fa-solid fa-server" style="font-size: 4rem;"></i>
                </div>
                <h2 class="fw-bold text-dark font-outfit mb-2">500 - Server Error</h2>
                <p class="text-muted small mb-4">
                    An internal server error occurred while processing your academic calculation. The transaction has been rolled back safely.
                </p>
                <div>
                    <a href="{{ url_for('auth.login') }}" class="btn btn-primary btn-sm px-4">
                        <i class="fa-solid fa-house me-1"></i> Return to Safety
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
