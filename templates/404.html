{% extends "base.html" %}

{% block title %}404 Not Found | MSBTE Student Saver{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 p-5 bg-white">
                <div class="text-warning mb-3">
                    <i class="fa-solid fa-triangle-exclamation" style="font-size: 4rem;"></i>
                </div>
                <h2 class="fw-bold text-dark font-outfit mb-2">404 - Page Not Found</h2>
                <p class="text-muted small mb-4">
                    The academic page or student record you requested does not exist or has been moved.
                </p>
                <div>
                    <a href="{{ url_for('auth.login') }}" class="btn btn-primary btn-sm px-4">
                        <i class="fa-solid fa-house me-1"></i> Return to Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
